.lil-gui, .lil-gui * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
.lil-gui.lil-root {
  width: var(--width, 245px);
  display: flex;
  flex-direction: column;
  background: var(--background-color);
}
.lil-gui.lil-root > .lil-title {
  background: var(--title-background-color);
  color: var(--title-text-color);
}
.lil-gui.lil-root > .lil-children {
  overflow-x: hidden;
  overflow-y: auto;
}
.lil-gui.lil-root > .lil-children::-webkit-scrollbar {
  width: var(--scrollbar-width);
  height: var(--scrollbar-width);
  background: var(--background-color);
}
.lil-gui.lil-root > .lil-children::-webkit-scrollbar-thumb {
  border-radius: var(--scrollbar-width);
  background: var(--focus-color);
}
@media (pointer: coarse) {
  .lil-gui.lil-allow-touch-styles, .lil-gui.lil-allow-touch-styles .lil-gui {
    --widget-height: 28px;
    --padding: 6px;
    --spacing: 6px;
    --font-size: 13px;
    --input-font-size: 16px;
    --folder-indent: 10px;
    --scrollbar-width: 7px;
    --slider-input-min-width: 50px;
    --color-input-min-width: 65px;
  }
}
.lil-gui.lil-force-touch-styles, .lil-gui.lil-force-touch-styles .lil-gui {
  --widget-height: 28px;
  --padding: 6px;
  --spacing: 6px;
  --font-size: 13px;
  --input-font-size: 16px;
  --folder-indent: 10px;
  --scrollbar-width: 7px;
  --slider-input-min-width: 50px;
  --color-input-min-width: 65px;
}
.lil-gui.lil-auto-place, .lil-gui.autoPlace {
  max-height: 100%;
  position: fixed;
  top: 0;
  right: 15px;
  z-index: 1001;
}

.lil-controller {
  display: flex;
  align-items: center;
  padding: 0 var(--padding);
  margin: var(--spacing) 0;
}
.lil-controller.lil-disabled {
  opacity: 0.5;
}
.lil-controller.lil-disabled, .lil-controller.lil-disabled * {
  pointer-events: none !important;
}
.lil-controller > .lil-name {
  min-width: var(--name-width);
  flex-shrink: 0;
  white-space: pre;
  padding-right: var(--spacing);
  line-height: var(--widget-height);
}
.lil-controller .lil-widget {
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
  min-height: var(--widget-height);
}
.lil-controller.lil-string input {
  color: var(--string-color);
}
.lil-controller.lil-boolean {
  cursor: pointer;
}
.lil-controller.lil-color .lil-display {
  width: 100%;
  height: var(--widget-height);
  border-radius: var(--widget-border-radius);
  position: relative;
}
@media (hover: hover) {
  .lil-controller.lil-color .lil-display:hover:before {
    content: " ";
    display: block;
    position: absolute;
    border-radius: var(--widget-border-radius);
    border: 1px solid #fff9;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
  }
}
.lil-controller.lil-color input[type=color] {
  opacity: 0;
  width: 100%;
  height: 100%;
  cursor: pointer;
}
.lil-controller.lil-color input[type=text] {
  margin-left: var(--spacing);
  font-family: var(--font-family-mono);
  min-width: var(--color-input-min-width);
  width: var(--color-input-width);
  flex-shrink: 0;
}
.lil-controller.lil-option select {
  opacity: 0;
  position: absolute;
  width: 100%;
  max-width: 100%;
}
.lil-controller.lil-option .lil-display {
  position: relative;
  pointer-events: none;
  border-radius: var(--widget-border-radius);
  height: var(--widget-height);
  line-height: var(--widget-height);
  max-width: 100%;
  overflow: hidden;
  word-break: break-all;
  padding-left: 0.55em;
  padding-right: 1.75em;
  background: var(--widget-color);
}
@media (hover: hover) {
  .lil-controller.lil-option .lil-display.lil-focus {
    background: var(--focus-color);
  }
}
.lil-controller.lil-option .lil-display.lil-active {
  background: var(--focus-color);
}
.lil-controller.lil-option .lil-display:after {
  font-family: "lil-gui";
  content: "↕";
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  padding-right: 0.375em;
}
.lil-controller.lil-option .lil-widget,
.lil-controller.lil-option select {
  cursor: pointer;
}
@media (hover: hover) {
  .lil-controller.lil-option .lil-widget:hover .lil-display {
    background: var(--hover-color);
  }
}
.lil-controller.lil-number input {
  color: var(--number-color);
}
.lil-controller.lil-number.lil-has-slider input {
  margin-left: var(--spacing);
  width: var(--slider-input-width);
  min-width: var(--slider-input-min-width);
  flex-shrink: 0;
}
.lil-controller.lil-number .lil-slider {
  width: 100%;
  height: var(--widget-height);
  background: var(--widget-color);
  border-radius: var(--widget-border-radius);
  padding-right: var(--slider-knob-width);
  overflow: hidden;
  cursor: ew-resize;
  touch-action: pan-y;
}
@media (hover: hover) {
  .lil-controller.lil-number .lil-slider:hover {
    background: var(--hover-color);
  }
}
.lil-controller.lil-number .lil-slider.lil-active {
  background: var(--focus-color);
}
.lil-controller.lil-number .lil-slider.lil-active .lil-fill {
  opacity: 0.95;
}
.lil-controller.lil-number .lil-fill {
  height: 100%;
  border-right: var(--slider-knob-width) solid var(--number-color);
  box-sizing: content-box;
}

.lil-dragging .lil-gui {
  --hover-color: var(--widget-color);
}
.lil-dragging * {
  cursor: ew-resize !important;
}
.lil-dragging.lil-vertical * {
  cursor: ns-resize !important;
}

.lil-gui .lil-title {
  height: var(--title-height);
  font-weight: 600;
  padding: 0 var(--padding);
  width: 100%;
  text-align: left;
  background: none;
  text-decoration-skip: objects;
}
.lil-gui .lil-title:before {
  font-family: "lil-gui";
  content: "▾";
  padding-right: 2px;
  display: inline-block;
}
.lil-gui .lil-title:active {
  background: var(--title-background-color);
  opacity: 0.75;
}
@media (hover: hover) {
  body:not(.lil-dragging) .lil-gui .lil-title:hover {
    background: var(--title-background-color);
    opacity: 0.85;
  }
  .lil-gui .lil-title:focus {
    text-decoration: underline var(--focus-color);
  }
}
.lil-gui.lil-root > .lil-title:focus {
  text-decoration: none !important;
}
.lil-gui.lil-closed > .lil-title:before {
  content: "▸";
}
.lil-gui.lil-closed > .lil-children {
  transform: translateY(-7px);
  opacity: 0;
}
.lil-gui.lil-closed:not(.lil-transition) > .lil-children {
  display: none;
}
.lil-gui.lil-transition > .lil-children {
  transition-duration: 300ms;
  transition-property: height, opacity, transform;
  transition-timing-function: cubic-bezier(0.2, 0.6, 0.35, 1);
  overflow: hidden;
  pointer-events: none;
}
.lil-gui .lil-children:empty:before {
  content: "Empty";
  padding: 0 var(--padding);
  margin: var(--spacing) 0;
  display: block;
  height: var(--widget-height);
  font-style: italic;
  line-height: var(--widget-height);
  opacity: 0.5;
}
.lil-gui.lil-root > .lil-children > .lil-gui > .lil-title {
  border: 0 solid var(--widget-color);
  border-width: 1px 0;
  transition: border-color 300ms;
}
.lil-gui.lil-root > .lil-children > .lil-gui.lil-closed > .lil-title {
  border-bottom-color: transparent;
}
.lil-gui + .lil-controller {
  border-top: 1px solid var(--widget-color);
  margin-top: 0;
  padding-top: var(--spacing);
}
.lil-gui .lil-gui .lil-gui > .lil-title {
  border: none;
}
.lil-gui .lil-gui .lil-gui > .lil-children {
  border: none;
  margin-left: var(--folder-indent);
  border-left: 2px solid var(--widget-color);
}
.lil-gui .lil-gui .lil-controller {
  border: none;
}

.lil-gui label, .lil-gui input, .lil-gui button {
  -webkit-tap-highlight-color: transparent;
}
.lil-gui input {
  border: 0;
  outline: none;
  font-family: var(--font-family);
  font-size: var(--input-font-size);
  border-radius: var(--widget-border-radius);
  height: var(--widget-height);
  background: var(--widget-color);
  color: var(--text-color);
  width: 100%;
}
@media (hover: hover) {
  .lil-gui input:hover {
    background: var(--hover-color);
  }
  .lil-gui input:active {
    background: var(--focus-color);
  }
}
.lil-gui input:disabled {
  opacity: 1;
}
.lil-gui input[type=text],
.lil-gui input[type=number] {
  padding: var(--widget-padding);
  -moz-appearance: textfield;
}
.lil-gui input[type=text]:focus,
.lil-gui input[type=number]:focus {
  background: var(--focus-color);
}
.lil-gui input[type=checkbox] {
  appearance: none;
  width: var(--checkbox-size);
  height: var(--checkbox-size);
  border-radius: var(--widget-border-radius);
  text-align: center;
  cursor: pointer;
}
.lil-gui input[type=checkbox]:checked:before {
  font-family: "lil-gui";
  content: "✓";
  font-size: var(--checkbox-size);
  line-height: var(--checkbox-size);
}
@media (hover: hover) {
  .lil-gui input[type=checkbox]:focus {
    box-shadow: inset 0 0 0 1px var(--focus-color);
  }
}
.lil-gui button {
  outline: none;
  cursor: pointer;
  font-family: var(--font-family);
  font-size: var(--font-size);
  color: var(--text-color);
  width: 100%;
  border: none;
}
.lil-gui .lil-controller button {
  height: var(--widget-height);
  text-transform: none;
  background: var(--widget-color);
  border-radius: var(--widget-border-radius);
}
@media (hover: hover) {
  .lil-gui .lil-controller button:hover {
    background: var(--hover-color);
  }
  .lil-gui .lil-controller button:focus {
    box-shadow: inset 0 0 0 1px var(--focus-color);
  }
}
.lil-gui .lil-controller button:active {
  background: var(--focus-color);
}

.cg-toasts { position:absolute; right:16px; top:16px; display:grid; gap:8px; z-index:40; pointer-events:none; }
.cg-toast { display:flex; gap:12px; align-items:center; min-width:240px; max-width:340px; padding:10px 14px; border-radius:10px;
  background:rgba(16,20,32,.94); color:#fff; font:14px/1.35 system-ui, sans-serif; border:1px solid rgba(255,215,74,.6);
  box-shadow:0 6px 24px rgba(0,0,0,.35); animation: cg-toast-in .35s cubic-bezier(.2,.9,.3,1.2); }
.cg-toast .ic { font-size:26px; } .cg-toast b { display:block; color:#ffd84a; font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
.cg-toast.out { animation: cg-toast-out .3s ease-in forwards; }

@keyframes cg-toast-out { to { transform: translateX(120%); opacity:0 } }
.cg-rank { display:grid; gap:6px; padding:10px 12px; border-radius:8px; background:rgba(255,255,255,.06); text-align:left; font-size:14px; }
.cg-rank .line { color:#ffd84a; font-weight:700; } .cg-rank .dim { opacity:.7; font-size:12.5px; }
.cg-rank ol { margin:0; padding-left:22px; display:grid; gap:2px; } .cg-rank li.me { color:#ffd84a; font-weight:700; }
.cg-rank a { color:#8ac4ff; font-size:13px; pointer-events:auto; }
.cg-ach { display:grid; gap:6px; max-height:50vh; overflow:auto; text-align:left; }
.cg-ach > div { display:flex; gap:10px; align-items:center; padding:6px 8px; border-radius:6px; background:rgba(255,255,255,.05); }
.cg-ach > div.locked { opacity:.5; } .cg-ach small { display:block; opacity:.75; }
.cg-name { font:inherit; font-size:16px; padding:10px 12px; border-radius:8px; border:1px solid rgba(255,255,255,.25); background:rgba(0,0,0,.25); color:inherit; width:100%; box-sizing:border-box; }

.cg-hg { position:absolute; inset:0; display:grid; place-items:center; pointer-events:auto; z-index:25; padding:16px; box-sizing:border-box;
  background: var(--gs-bg, rgba(4,6,12,.8)); color: var(--look-ink, var(--gs-ink, #f4f6fb)); font-family: var(--look-body, var(--gs-font, system-ui)); }
.cg-hg-sheet { width:min(940px, 100%); max-height:100%; overflow:auto; background: var(--look-paper, var(--gs-panel, #121826)); border:2px solid currentColor;
  box-shadow: var(--look-shadow, 0 10px 30px rgba(0,0,0,.4)); padding: 20px 22px; box-sizing:border-box; display:grid; gap:14px; }
.cg-hg-top { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; border-bottom: 2px solid currentColor; padding-bottom:10px; }
.cg-hg-title { font-family: var(--look-title, var(--gs-title-font, inherit)); font-size: clamp(26px, 4.4vw, 46px); line-height:.9; text-transform: uppercase; letter-spacing:-.02em; }
.cg-hg-note { font-size: 12px; opacity:.75; margin-top:6px; }
.cg-hg-points { text-align:right; font-size: 11px; letter-spacing:.14em; text-transform:uppercase; }
.cg-hg-points b { display:block; font-family: var(--look-title, inherit); font-size: clamp(22px, 3vw, 32px); letter-spacing:0; }
.cg-hg-tabs { display:flex; gap:8px; flex-wrap:wrap; }
.cg-hg-tab { font:inherit; color:inherit; background:transparent; border:2px solid currentColor; padding:7px 12px; cursor:pointer; text-transform:uppercase; letter-spacing:.08em; font-size:12px; font-weight:700; }
.cg-hg-tab.on { background: currentColor; }
.cg-hg-tab.on span { color: var(--look-paper, #111); }
.cg-hg-tab.lock { opacity:.45; }
.cg-hg-body { display:grid; grid-template-columns: minmax(160px, 240px) 1fr; gap:18px; align-items:start; }
.cg-hg-prev { width:100%; aspect-ratio: 1; border:2px solid currentColor; background: var(--look-panel, rgba(255,255,255,.05)); }
.cg-hg-rows { display:grid; gap:6px; }
.cg-hg-row { display:grid; grid-template-columns: 1fr auto 86px; gap:12px; align-items:center; padding:7px 10px; border:2px solid transparent; cursor:pointer; }
.cg-hg-row.focus { border-color: currentColor; }
.cg-hg-row .nm { font-weight:700; text-transform:uppercase; letter-spacing:.06em; font-size:13px; }
.cg-hg-row .tx { font-size:11.5px; opacity:.75; margin-top:2px; }
.cg-hg-pips { display:flex; gap:3px; }
.cg-hg-pips i { width:10px; height:14px; border:1.5px solid currentColor; display:block; }
.cg-hg-pips i.on { background: currentColor; }
.cg-hg-cost { text-align:right; font-weight:700; font-variant-numeric: tabular-nums; border:2px solid currentColor; padding:5px 8px; font-size:13px; }
.cg-hg-row.cant .cg-hg-cost { opacity:.4; border-style: dashed; }
.cg-hg-row.max .cg-hg-cost { border-color: transparent; opacity:.6; }
.cg-hg-row.bought { animation: cg-hg-pop .35s ease-out; }
.cg-hg-locked { padding: 30px 12px; font-size: 14px; text-transform: uppercase; letter-spacing:.1em; border: 2px dashed currentColor; text-align:center; }
.cg-hg-go { font:inherit; font-family: var(--look-title, inherit); font-size: clamp(18px, 2.6vw, 26px); text-transform:uppercase; cursor:pointer; justify-self:end;
  background: var(--look-enemy, var(--gs-accent, #ffd84a)); color: var(--look-paper, #111); border:2px solid var(--look-ink, currentColor); box-shadow: var(--look-shadow, none); padding: 10px 26px; }
.cg-hg-go.focus, .cg-hg-go:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--look-ink, #000); }
.cg-hg-go:disabled { opacity:.4; cursor: default; }
@keyframes cg-hg-pop { 0% { background: var(--look-hazard, #ffd84a); } 100% { background: transparent; } }
@media (max-width: 640px) { .cg-hg-body { grid-template-columns: 1fr; } .cg-hg-prev { max-width: 160px; } }
